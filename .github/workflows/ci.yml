name: CI

on: 
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Setup envtest
        uses: kubernetes-sigs/setup-envtest@main
        with:
          version: 'latest'

      - name: Run tests
        run: |
          source <(setup-envtest use -p env)
          go test ./...